name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dashboard:
    name: dashboard (lint & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      # TODO: remove continue-on-error once the 11 pre-existing ESLint errors are fixed
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder-key

  mobile:
    name: mobile (analyze & test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      # TODO: flutter analyze exits non-zero on pre-existing diagnostics; enforce once resolved
      - name: Analyze (advisory)
        run: flutter analyze
        continue-on-error: true
      # TODO: flutter test has a pre-existing failing counter test under the current Flutter SDK; enforce once fixed
      - name: Test (advisory)
        run: flutter test
        continue-on-error: true
